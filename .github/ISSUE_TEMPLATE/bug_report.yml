name: Bug report
description: Something is broken in the product app, API, admin, or marketing site
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Product app (Expo / iOS / Android / web)
        - Product app (Apple TV / Android TV)
        - API (NestJS)
        - Admin console
        - Marketing site
        - Shared packages / tooling
        - Screenshot studio / store assets
        - Docs
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / commit version
      description: App version, build number, or git SHA if known
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Apple TV
        - Android TV
        - Expo web / PWA
        - Marketing web
        - Admin console
        - API only
        - Multiple / other
  - type: textarea
    id: extras
    attributes:
      label: Screenshots / logs
      description: Redact secrets and personal worship data.
