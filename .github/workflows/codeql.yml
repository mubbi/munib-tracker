name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Advanced setup only. Do not enable GitHub CodeQL Default setup alongside this
# workflow — it auto-detects Kotlin/Swift/Ruby and fails (see docs/OPEN_SOURCE.md).
#
# Intentionally omitted:
#   java-kotlin — Expo modules need the generated android/ Gradle tree (gitignored)
#   swift       — widgets / Expo iOS modules need the generated ios/ Xcode project
#   ruby        — CocoaPods .podspec files only; not a Ruby app
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    env:
      # Diff-informed analysis reads the PR diff via the compare API, which
      # caps at 300 files; past that the action warns "Cannot retrieve the full
      # diff" and falls back to a full scan anyway. Opt out up front on those
      # PRs (e.g. develop → main) so the run is quiet; smaller PRs keep it.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: ${{ github.event.pull_request.changed_files >= 300 && 'false' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing in this job pushes; don't leave the token in .git/config
          # where build/test scripts from the PR could read it.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
