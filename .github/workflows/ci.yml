name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_UI: "false"

permissions:
  contents: read

jobs:
  verify:
    name: Type-check, lint, test, build, OpenAPI drift
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Nothing in this job pushes; don't leave the token in .git/config
          # where build/test scripts from the PR could read it.
          persist-credentials: false

      - name: Setup pnpm
        # Version comes from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', '**/turbo.json') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/app Jest: Babel (+ istanbul) transforms of ~11k modules are the bulk of a
      # cold run. The cache is content-addressed, so restoring an older one is safe;
      # the key resets with the lockfile, Babel/Jest config and month to drop stale
      # entries. Restored after install so pnpm never sees it (jest.config.js
      # `cacheDirectory`, GitHub Actions only — locally Jest keeps the OS temp dir).
      - name: Jest cache key
        id: jest-cache
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache Jest transforms
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/jest
          key: jest-${{ runner.os }}-${{ steps.jest-cache.outputs.month }}-${{ hashFiles('pnpm-lock.yaml', 'apps/app/babel.config.js', 'apps/app/jest.config.js') }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ steps.jest-cache.outputs.month }}-${{ hashFiles('pnpm-lock.yaml', 'apps/app/babel.config.js', 'apps/app/jest.config.js') }}-

      - name: Type-check, lint, test, build, OpenAPI generate drift
        run: pnpm check:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
