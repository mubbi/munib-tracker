version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      expo-ecosystem:
        patterns:
          - "expo*"
          - "@expo/*"
          - "react-native*"
      nestjs-ecosystem:
        patterns:
          - "@nestjs/*"
      next-ecosystem:
        patterns:
          - "next"
          - "@next/*"
      lint-tooling:
        patterns:
          - "@biomejs/*"
          - "turbo"
          - "typescript"
          - "husky"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
