packages:
  - "apps/*"
  - "packages/*"

# Flatten node_modules (no .pnpm symlink store). Required on Windows so that
# native module build paths (e.g. react-native-screens/-worklets CMake/prefab)
# stay under the 260-char MAX_PATH limit.
nodeLinker: hoisted
autoInstallPeers: true

allowBuilds:
  sqlite3: false
  dtrace-provider: false
  "@scarf/scarf": false
  "@sentry/cli": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true

audit:
  ignore:
    # image-size@1.2.1 is patched locally; upstream 2.0.3 is not published yet.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

