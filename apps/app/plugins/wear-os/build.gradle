// Compose compiler plugin for the tasbeeh counter (D-UX4), pinned to the Kotlin Gradle plugin the
// root build resolves — the same pattern Expo's own Compose modules (expo-modules-core, @expo/ui) use.
buildscript {
    def rootKotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : null
    if (!rootKotlinVersion) {
        throw new GradleException("[withWearOs] rootProject.ext.kotlinVersion is not set — the Compose compiler plugin must match the Kotlin Gradle plugin.")
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${rootKotlinVersion}")
    }
}

plugins {
    id 'com.android.application'
}

// Copied verbatim into android/wear by plugins/withWearOs.cjs (edit this file, not the copy).
// AGP 9 compiles Kotlin itself ("built-in Kotlin"). The Expo SDK 58 template opts out with
// android.builtInKotlin=false until AGP 10; only then is the Kotlin Gradle plugin applied here.
if ((findProperty('android.builtInKotlin') ?: 'true').toString() == 'false') {
    apply plugin: 'org.jetbrains.kotlin.android'
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def safeExtGet = { String prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    // Unique namespace: modules/munib-wear (the phone-side listener) owns expo.modules.munibwear.
    namespace 'app.munibtracker.wear'
    compileSdk safeExtGet('compileSdkVersion', 37)

    defaultConfig {
        // The Wearable Data Layer only connects apps that share the phone app's application ID
        // and signing key. Play ships this as the Wear OS form factor of app.munibtracker.
        applicationId "app.munibtracker"
        minSdk 30
        targetSdk safeExtGet('targetSdkVersion', 36)
        // apps/app/.env is the single source of truth (release scripts export it). Phone, TV
        // and Wear share one Play package, so they share one versionCode counter.
        versionCode Integer.parseInt(System.getenv("EXPO_ANDROID_VERSION_CODE") ?: "1")
        versionName System.getenv("EXPO_ANDROID_APP_VERSION") ?: "1.0.0"
    }

    buildFeatures {
        // Only the tasbeeh counter is Compose; tiles use ProtoLayout, the home screen Views.
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            // Same debug keystore as :app so debug builds can talk over the Data Layer.
            storeFile rootProject.file('app/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // R8 shrinks Guava / Play Services out of the watch APK, and AGP embeds the
            // mapping file in the AAB so Play can deobfuscate crashes and ANRs.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else if (gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }) {
                throw new GradleException("[withWearOs] android/keystore.properties missing — refusing to sign a Wear release with the debug key.")
            }
        }
    }
}

dependencies {
    implementation 'androidx.wear.tiles:tiles:1.6.2'
    implementation 'androidx.wear.protolayout:protolayout:1.4.2'
    implementation 'androidx.wear.protolayout:protolayout-material:1.4.2'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.guava:guava:33.8.0-android'
    // Watch-face complications (Next Salah, today's progress).
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.3.0'
    // Tasbeeh counter (D-UX4: Compose for Wear OS, Material 3). Owner-approved; nothing else.
    implementation 'androidx.wear.compose:compose-material3:1.7.2'
    implementation 'androidx.wear.compose:compose-foundation:1.7.2'
    implementation 'androidx.activity:activity-compose:1.13.0'
}
