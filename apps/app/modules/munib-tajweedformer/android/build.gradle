// Quran Lab TajweedFormer bridge (Phase 6 pronunciation drills).
//
// Min SDK: the Quran Lab AAR declares minSdk 26 (Android 8.0); the app's minSdk is 24.
// This library keeps the app's minSdk so it compiles into the app, and the module's
// config plugin (`../app.plugin.js`) adds
//   <uses-sdk tools:overrideLibrary="ai.quranlab.tajweedformer" />
// to the app manifest so the manifest merger accepts the AAR. The JS caller only
// touches this module when `Platform.Version >= 26` — on API 24/25 the native SDK
// would fail to load, so pronunciation drills are simply unavailable there.
//
// The SDK's manifest brings RECORD_AUDIO, INTERNET, ACCESS_NETWORK_STATE and
// (through WorkManager) WAKE_LOCK, RECEIVE_BOOT_COMPLETED and FOREGROUND_SERVICE,
// plus the Play Integrity library. Android TV excludes this module from autolinking
// (plugins/withTvExpoModuleExcludes.cjs), so none of that reaches the TV build.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.munibtajweedformer'
version = '1.0.0'

android {
  namespace "expo.modules.munibtajweedformer"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${getKotlinVersion()}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
  // Pinned: the Kotlin SDK and the iOS SDK (3.1.4) share one engine and one error catalogue.
  implementation "ai.quranlab:tajweedformer:3.1.5"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def getKotlinVersion() {
  return rootProject.ext.has("kotlinVersion") ? rootProject.ext.kotlinVersion : "2.0.21"
}
