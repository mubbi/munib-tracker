// Phone-side Wear OS listener. expo-module-gradle-plugin supplies SDK levels, Kotlin
// and expo-modules-core. The watch app itself is generated by plugins/withWearOs.cjs.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.munibwear'
version = '1.0.0'

android {
  namespace "expo.modules.munibwear"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-wearable:20.0.1"
}
