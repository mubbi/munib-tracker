apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.munibexternalcommands'
version = '1.0.0'

android {
  namespace "expo.modules.munibexternalcommands"
  compileSdkVersion safeExtGet("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${getKotlinVersion()}"
  implementation "com.google.android.gms:play-services-wearable:18.2.0"
  // NotificationCompat.ProgressStyle + setRequestPromotedOngoing (Android 16 Live Updates).
  implementation "androidx.core:core-ktx:1.17.0"
}

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def getKotlinVersion() {
  return rootProject.ext.has("kotlinVersion") ? rootProject.ext.kotlinVersion : "2.0.21"
}
