// expo-module-gradle-plugin supplies compileSdk / minSdk / targetSdk, Kotlin (AGP 9
// built-in Kotlin or the Kotlin Gradle plugin, matching the app) and expo-modules-core.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.munibexternalcommands'
version = '1.0.0'

android {
  namespace "expo.modules.munibexternalcommands"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lint {
    abortOnError false
  }
}

dependencies {
  implementation "com.google.android.gms:play-services-wearable:20.0.1"
  // NotificationCompat.ProgressStyle + setRequestPromotedOngoing (Android 16 Live Updates).
  implementation "androidx.core:core-ktx:1.19.1"
}
